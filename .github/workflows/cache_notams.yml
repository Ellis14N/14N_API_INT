name: Cache NOTAMs

on:
  schedule:
    - cron: '5 22 * * *'  # 22:05 UTC + ~6hr GitHub delay = 04:05 Morocco (UTC+1)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx python-dotenv

      - name: Run Autorouter NOTAM cache job
        env:
          AUTOROUTER_CLIENT_ID: ${{ secrets.AUTOROUTER_CLIENT_ID }}
          AUTOROUTER_CLIENT_SECRET: ${{ secrets.AUTOROUTER_CLIENT_SECRET }}
        run: python fetch_and_cache.py --task notams_autorouter

      - name: Run SkyLink NOTAM cache job
        env:
          SKYLINK_API_KEY: ${{ secrets.SKYLINK_API_KEY }}
        run: python fetch_and_cache.py --task notams_skylink

      - name: Push cache files to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE_LABEL=$(date -u +%d-%m-%y)
          AUTOROUTER_FILE="cache/NOTAMs Autorouter ${DATE_LABEL}.json"
          SKYLINK_FILE="cache/NOTAMs SkyLink ${DATE_LABEL}.json"

          # Both files are optional; the run fails only if NEITHER was produced.
          # Autorouter requires an approved support ticket; SkyLink requires
          # the RapidAPI key + remaining quota. Either source alone is enough.
          HAS_AUTO=0; HAS_SKY=0
          [ -f "$AUTOROUTER_FILE" ] && HAS_AUTO=1 || echo "Autorouter cache file not produced (auth pending or fetch failed) — skipping"
          [ -f "$SKYLINK_FILE" ]    && HAS_SKY=1  || echo "SkyLink cache file not produced (key unset or quota exhausted) — skipping"

          if [ $HAS_AUTO -eq 0 ] && [ $HAS_SKY -eq 0 ]; then
            echo "Neither NOTAM cache file was produced — nothing to publish"
            ls cache/ || true
            exit 1
          fi

          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true

          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git worktree add /tmp/data-branch data
            git -C /tmp/data-branch pull origin data --rebase 2>/dev/null || true
          else
            git worktree add --orphan -b data /tmp/data-branch
          fi

          mkdir -p "/tmp/data-branch/cache"
          if [ $HAS_AUTO -eq 1 ]; then
            cp "$AUTOROUTER_FILE" "/tmp/data-branch/${AUTOROUTER_FILE}"
          fi
          if [ $HAS_SKY -eq 1 ]; then
            cp "$SKYLINK_FILE" "/tmp/data-branch/${SKYLINK_FILE}"
          fi

          cd /tmp/data-branch
          [ $HAS_AUTO -eq 1 ] && git add "${AUTOROUTER_FILE}"
          [ $HAS_SKY  -eq 1 ] && git add "${SKYLINK_FILE}"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: notams cache ${DATE_LABEL}"
          git push origin data
