name: Cache NOTAMs (Autorouter)

on:
  schedule:
    - cron: '5 22 * * *'  # 22:05 UTC + ~6hr GitHub delay = 04:05 Morocco (UTC+1)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx python-dotenv

      - name: Run Autorouter NOTAM cache job
        env:
          AUTOROUTER_CLIENT_ID: ${{ secrets.AUTOROUTER_CLIENT_ID }}
          AUTOROUTER_CLIENT_SECRET: ${{ secrets.AUTOROUTER_CLIENT_SECRET }}
        run: python fetch_and_cache.py --task notams_autorouter

      - name: Push Autorouter cache file to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE_LABEL=$(date -u +%d-%m-%y)
          AUTOROUTER_FILE="cache/NOTAMs Autorouter ${DATE_LABEL}.json"

          # Autorouter requires an approved support ticket. Until that's granted
          # the cache function logs the auth failure and skips writing a file.
          # Treat that as a clean no-op rather than a workflow failure.
          if [ ! -f "$AUTOROUTER_FILE" ]; then
            echo "Autorouter cache file not produced — auth pending or fetch failed. Nothing to publish."
            exit 0
          fi

          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true

          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git worktree add /tmp/data-branch data
            git -C /tmp/data-branch pull origin data --rebase 2>/dev/null || true
          else
            git worktree add --orphan -b data /tmp/data-branch
          fi

          mkdir -p "/tmp/data-branch/cache"
          cp "$AUTOROUTER_FILE" "/tmp/data-branch/${AUTOROUTER_FILE}"

          cd /tmp/data-branch
          git add "${AUTOROUTER_FILE}"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: autorouter notams cache ${DATE_LABEL}"
          git push origin data
